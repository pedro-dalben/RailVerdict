name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: gem install rubocop --no-document
      - run: bundle exec ruby script/validate-foundation
      - run: bundle exec rake test
      - run: gem build rail_verdict.gemspec
      - run: sha256sum rail_verdict-*.gem && gem spec rail_verdict-*.gem files | tr ',' '\n' | grep -q "exe/railverdict-minitest-reporter.rb"

  build-once:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build rail_verdict.gemspec
      - run: sha256sum rail_verdict-*.gem | tee checksum.txt
      - run: gem install ./rail_verdict-*.gem --no-document
      - run: railverdict --version && railverdict --help | head -n 20
